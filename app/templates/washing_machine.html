{% extends "base.html" %}

{% block content %}
    <div class="container mt-5">
        <h1>Симуляція пральної машини</h1>
    </div>
    <div class="form-btn">
        <form method="POST" id="wash-form">
            {{ form.hidden_tag() }}
            {{ form.start_button(class="custom-btn") }}
        </form>
    </div>
    
    <div id="wash-status">
        <p>Статус: <span id="current-status">Очікування початку...</span></p>
    </div>

{% endblock %}
